[package]
name = "pwcost"
version = "0.1.0"
edition = "2024"

[dependencies]
rand_chacha_09 = { package = "rand_chacha", version = "0.9" }
chacha20poly1305 = "0.11.0"
hkdf = "0.13.0"
hpke = { version = "0.13", default-features = false, features = ["alloc", "x25519"] }
prio = "0.18.1"
rand = "0.10.3"
rand_chacha = "0.10.0"
rand_core = "0.10.1"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
x25519-dalek = { version = "3.0.0", features = ["static_secrets", "getrandom"] }
